<!doctype html>
<html lang="zh-Hans">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>窝囊费 Onboarding 文案编辑器</title>
  <style>
    :root {
      --bg: #fff7e8;
      --paper: #fffdf7;
      --soft: #fff0c9;
      --ink: #0d0d0d;
      --muted: #847b6d;
      --line: rgba(13, 13, 13, 0.08);
      --yellow: #ffc83d;
      --gold: #ffd763;
      --green: #96d684;
      font-family: "PingFang SC", -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif;
    }

    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    body {
      background:
        radial-gradient(circle at 10% 10%, rgba(255, 255, 255, 0.92), transparent 28%),
        radial-gradient(circle at 86% 0%, rgba(255, 200, 61, 0.18), transparent 26%),
        linear-gradient(180deg, #fffdf8 0%, var(--bg) 100%);
      color: var(--ink);
    }

    button, textarea, input { font: inherit; }
    button { cursor: pointer; border: 0; -webkit-tap-highlight-color: transparent; }

    .app {
      min-height: 100vh;
      display: grid;
      grid-template-columns: minmax(320px, 420px) minmax(360px, 1fr);
      gap: 28px;
      padding: 28px;
    }

    .preview-wrap {
      position: sticky;
      top: 28px;
      height: calc(100vh - 56px);
      display: grid;
      place-items: center;
    }

    .phone {
      width: min(100%, 390px);
      height: min(100%, 844px);
      min-height: 720px;
      border-radius: 46px;
      overflow: hidden;
      background: linear-gradient(180deg, #fffefa 0%, #fff5dc 78%, #ffefbd 100%);
      box-shadow: 0 34px 80px rgba(20, 16, 10, 0.18);
      position: relative;
    }

    .status {
      height: 62px;
      padding: 19px 24px 0;
      display: flex;
      justify-content: space-between;
      font-size: 14px;
      font-weight: 900;
    }

    .notch {
      position: absolute;
      left: 50%;
      top: 14px;
      transform: translateX(-50%);
      width: 118px;
      height: 31px;
      border-radius: 999px;
      background: #000;
    }

    .screen {
      height: calc(100% - 62px);
      display: grid;
      grid-template-rows: auto 230px auto auto 1fr auto;
      gap: 14px;
      padding: 10px 24px 24px;
    }

    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      min-height: 34px;
      font-size: 22px;
      font-weight: 1000;
      letter-spacing: -0.02em;
    }

    .tag {
      display: inline-grid;
      place-items: center;
      width: 18px;
      height: 18px;
      margin-left: 5px;
      border-radius: 6px;
      color: white;
      background: linear-gradient(135deg, #ffe88a, var(--yellow));
      font-size: 13px;
      vertical-align: middle;
    }

    .skip {
      background: transparent;
      color: var(--muted);
      font-size: 13px;
      font-weight: 900;
    }

    .hero {
      position: relative;
      display: grid;
      place-items: center;
      isolation: isolate;
    }

    .hero::before,
    .hero::after {
      content: "";
      position: absolute;
      z-index: -1;
      border-radius: 999px;
      filter: blur(24px);
    }

    .hero::before {
      width: 310px;
      height: 190px;
      background: rgba(255, 200, 61, 0.16);
      transform: translate(-24px, 12px);
    }

    .hero::after {
      width: 280px;
      height: 170px;
      background: rgba(255, 255, 255, 0.42);
      transform: translate(26px, -18px);
    }

    .hero img {
      max-width: 94%;
      max-height: 100%;
      object-fit: contain;
      mix-blend-mode: multiply;
      filter: drop-shadow(0 12px 16px rgba(0,0,0,0.06));
    }

    .copy {
      padding: 0 2px;
    }

    h1 {
      margin: 0;
      font-size: 30px;
      line-height: 1.17;
      letter-spacing: -0.02em;
    }

    .lead {
      margin: 10px 0 0;
      color: var(--muted);
      font-size: 14px;
      font-weight: 800;
      line-height: 1.5;
    }

    .card {
      min-height: 70px;
      border-radius: 22px;
      background: rgba(255, 255, 255, 0.88);
      border: 1px solid var(--line);
      padding: 14px;
      box-shadow: 0 12px 28px rgba(24, 18, 8, 0.06);
    }

    .hint-card {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .coin {
      width: 30px;
      height: 30px;
      border-radius: 10px;
      background: var(--yellow);
      color: #fff;
      display: grid;
      place-items: center;
      font-weight: 1000;
    }

    .hint-card b { display: block; font-size: 15px; }
    .hint-card span { color: var(--muted); font-size: 12px; font-weight: 800; }

    .mock-line {
      display: flex;
      justify-content: space-between;
      align-items: center;
      min-height: 30px;
      font-size: 13px;
      font-weight: 900;
    }

    .mock-line strong {
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    }

    .dots {
      display: flex;
      justify-content: center;
      gap: 8px;
      padding-top: 3px;
    }

    .dot {
      width: 8px;
      height: 8px;
      border-radius: 999px;
      background: rgba(13, 13, 13, 0.12);
    }

    .dot.active {
      width: 24px;
      background: var(--ink);
    }

    .cta {
      min-height: 54px;
      border-radius: 999px;
      color: white;
      background: var(--ink);
      font-size: 16px;
      font-weight: 1000;
      width: 100%;
    }

    .panel {
      max-width: 920px;
      display: grid;
      gap: 18px;
      align-content: start;
    }

    .panel-head {
      display: flex;
      justify-content: space-between;
      gap: 16px;
      align-items: end;
      padding-top: 4px;
    }

    .panel h2 {
      margin: 0;
      font-size: 30px;
      letter-spacing: -0.03em;
    }

    .panel p {
      margin: 7px 0 0;
      color: var(--muted);
      font-weight: 750;
      line-height: 1.5;
    }

    .toolbar {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      justify-content: flex-end;
    }

    .tool-btn {
      min-height: 40px;
      padding: 0 14px;
      border-radius: 999px;
      background: var(--ink);
      color: white;
      font-weight: 950;
    }

    .tool-btn.secondary {
      background: white;
      color: var(--ink);
      border: 1px solid var(--line);
    }

    .tabs {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
    }

    .tab {
      min-height: 46px;
      border-radius: 16px;
      background: rgba(255,255,255,0.7);
      color: var(--muted);
      font-weight: 1000;
      border: 1px solid var(--line);
    }

    .tab.active {
      color: white;
      background: var(--ink);
    }

    .editor {
      display: grid;
      gap: 14px;
      padding: 18px;
      border-radius: 26px;
      background: rgba(255, 255, 255, 0.74);
      border: 1px solid rgba(255, 255, 255, 0.8);
      box-shadow: 0 18px 44px rgba(24, 18, 8, 0.08);
    }

    .field {
      display: grid;
      gap: 7px;
    }

    label {
      color: var(--muted);
      font-size: 12px;
      font-weight: 1000;
      letter-spacing: 1px;
    }

    input, textarea {
      width: 100%;
      border: 1px solid var(--line);
      outline: none;
      border-radius: 16px;
      background: rgba(255,255,255,0.9);
      color: var(--ink);
      padding: 12px 13px;
      font-weight: 850;
      line-height: 1.45;
    }

    textarea { min-height: 86px; resize: vertical; }
    input:focus, textarea:focus { box-shadow: 0 0 0 3px rgba(255, 200, 61, 0.28); }

    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
    }

    .json-box {
      min-height: 160px;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 12px;
      font-weight: 700;
      white-space: pre-wrap;
    }

    .toast {
      position: fixed;
      right: 24px;
      bottom: 24px;
      padding: 12px 16px;
      border-radius: 999px;
      background: var(--ink);
      color: white;
      font-weight: 950;
      opacity: 0;
      transform: translateY(12px);
      transition: 180ms ease;
      pointer-events: none;
    }

    .toast.show {
      opacity: 1;
      transform: translateY(0);
    }

    @media (max-width: 880px) {
      .app {
        grid-template-columns: 1fr;
        padding: 18px;
      }
      .preview-wrap {
        position: relative;
        top: auto;
        height: auto;
      }
      .phone {
        height: 760px;
      }
      .panel-head {
        display: grid;
      }
      .toolbar {
        justify-content: start;
      }
    }
  </style>
</head>
<body>
  <main class="app">
    <section class="preview-wrap">
      <div class="phone" aria-label="实时预览">
        <div class="notch"></div>
        <div class="status"><span>14:08</span><span>5G ▰</span></div>
        <div class="screen">
          <div class="topbar"><span id="previewHeader">窝囊费<span class="tag">¥</span></span><button class="skip">跳过</button></div>
          <div class="hero"><img id="previewImage" alt="" /></div>
          <div class="copy">
            <h1 id="previewTitle"></h1>
            <p class="lead" id="previewLead"></p>
          </div>
          <div class="card" id="previewCard"></div>
          <div class="dots" id="previewDots"></div>
          <button class="cta" id="previewCta">下一步</button>
        </div>
      </div>
    </section>

    <section class="panel">
      <div class="panel-head">
        <div>
          <h2>Onboarding 文案编辑器</h2>
          <p>直接改右侧字段，左边实时预览。改完点“复制 JSON”，我可以按这份同步回 SwiftUI。</p>
        </div>
        <div class="toolbar">
          <button class="tool-btn secondary" id="resetBtn">恢复当前版本</button>
          <button class="tool-btn" id="copyBtn">复制 JSON</button>
        </div>
      </div>

      <div class="tabs" id="tabs"></div>

      <form class="editor" id="editor">
        <div class="grid">
          <div class="field">
            <label for="header">顶部标题</label>
            <input id="header" />
          </div>
        </div>
        <div class="field">
          <label for="title">大标题</label>
          <textarea id="title"></textarea>
        </div>
        <div class="field">
          <label for="lead">说明文案</label>
          <textarea id="lead"></textarea>
        </div>
        <div class="grid">
          <div class="field">
            <label for="cardTitle">辅助卡片标题</label>
            <input id="cardTitle" />
          </div>
          <div class="field">
            <label for="cardSubtitle">辅助卡片说明</label>
            <input id="cardSubtitle" />
          </div>
        </div>
        <div class="field">
          <label for="jsonOutput">当前 JSON</label>
          <textarea id="jsonOutput" class="json-box" readonly></textarea>
        </div>
      </form>
    </section>
  </main>
  <div class="toast" id="toast">已复制</div>

  <script>
    const imageBase = "../WNF/Assets.xcassets/";
    const images = [
      "OnboardingP1.imageset/onboarding-p1.png",
      "OnboardingP2.imageset/onboarding-p2.png",
      "OnboardingLunchSleep.imageset/onboarding-lunch-sleep.png",
      "OnboardingP4.imageset/onboarding-p4.png"
    ];

    const defaults = [
      {
        header: "窝囊费",
        title: "先别破防，看看今天能挣多少窝囊费",
        lead: "上班已经够委屈了，至少知道自己每秒能挣多少钱。",
        cardTitle: "工资拆开看",
        cardSubtitle: "每小时都算数，钱一秒一秒回来。"
      },
      {
        header: "月薪设置",
        title: "输入月薪，别让公司糊弄你。",
        lead: "税前税后都行，能拿多少才是真。",
        cardTitle: "¥18,000",
        cardSubtitle: "月薪只是一个数，崩溃才是真实的。"
      },
      {
        header: "作息确认",
        title: "再确认一下，公司有没有午休。",
        lead: "没有午休就直接关掉，时薪会按真实计薪时长计算。",
        cardTitle: "8h 计薪",
        cardSubtitle: "午休 1h"
      },
      {
        header: "准备开工",
        title: "开始挣窝囊费啦！",
        lead: "这还得熬多久......？",
        cardTitle: "每个工作日目标 ¥692",
        cardSubtitle: "每小时窝囊费 ¥87"
      }
    ];

    const storageKey = "wnf-onboarding-copy-draft";
    let pages = loadPages();
    let current = 0;

    const fields = ["header", "title", "lead", "cardTitle", "cardSubtitle"];

    function loadPages() {
      try {
        const saved = JSON.parse(localStorage.getItem(storageKey));
        if (Array.isArray(saved) && saved.length === 4) return saved;
      } catch (_) {}
      return structuredClone(defaults);
    }

    function savePages() {
      localStorage.setItem(storageKey, JSON.stringify(pages));
    }

    function renderTabs() {
      const wrap = document.querySelector("#tabs");
      wrap.innerHTML = "";
      pages.forEach((_, index) => {
        const btn = document.createElement("button");
        btn.className = `tab${index === current ? " active" : ""}`;
        btn.type = "button";
        btn.textContent = `第 ${index + 1} 屏`;
        btn.addEventListener("click", () => {
          current = index;
          render();
        });
        wrap.appendChild(btn);
      });
    }

    function renderEditor() {
      const page = pages[current];
      fields.forEach((key) => {
        document.querySelector(`#${key}`).value = page[key] || "";
      });
      document.querySelector("#jsonOutput").value = JSON.stringify(pages, null, 2);
    }

    function renderPreview() {
      const page = pages[current];
      document.querySelector("#previewHeader").innerHTML = `${escapeHtml(page.header)}<span class="tag">¥</span>`;
      document.querySelector("#previewImage").src = imageBase + images[current];
      document.querySelector("#previewTitle").textContent = page.title;
      document.querySelector("#previewLead").textContent = page.lead;
      document.querySelector("#previewCta").textContent = current === 3 ? "开始使用" : "下一步";

      const card = document.querySelector("#previewCard");
      card.innerHTML = current === 0
        ? `<div class="hint-card"><span class="coin">¥</span><div><b>${escapeHtml(page.cardTitle)}</b><span>${escapeHtml(page.cardSubtitle)}</span></div></div>`
        : `<div class="mock-line"><span>${escapeHtml(page.cardTitle)}</span><strong>${escapeHtml(page.cardSubtitle)}</strong></div>`;

      const dots = document.querySelector("#previewDots");
      dots.innerHTML = "";
      for (let i = 0; i < 4; i += 1) {
        const dot = document.createElement("span");
        dot.className = `dot${i === current ? " active" : ""}`;
        dots.appendChild(dot);
      }
    }

    function render() {
      renderTabs();
      renderEditor();
      renderPreview();
      savePages();
    }

    function escapeHtml(value) {
      return String(value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;");
    }

    fields.forEach((key) => {
      document.querySelector(`#${key}`).addEventListener("input", (event) => {
        pages[current][key] = event.target.value;
        renderPreview();
        document.querySelector("#jsonOutput").value = JSON.stringify(pages, null, 2);
        savePages();
      });
    });

    document.querySelector("#copyBtn").addEventListener("click", async () => {
      const json = JSON.stringify(pages, null, 2);
      await navigator.clipboard.writeText(json);
      showToast("已复制 JSON");
    });

    document.querySelector("#resetBtn").addEventListener("click", () => {
      pages = structuredClone(defaults);
      current = 0;
      localStorage.removeItem(storageKey);
      render();
      showToast("已恢复当前版本");
    });

    function showToast(text) {
      const toast = document.querySelector("#toast");
      toast.textContent = text;
      toast.classList.add("show");
      setTimeout(() => toast.classList.remove("show"), 1400);
    }

    render();
  </script>
</body>
</html>
